; Builds bc250_test.ino in this folder. Not yet run; verify the board id
; with `pio boards xiao`.
[platformio]
src_dir = .

[env:xiao_esp32c3]
platform = espressif32
board = seeed_xiao_esp32c3
framework = arduino
; WiFi + Bluetooth do not fit the default 1.3 MB app slot.
board_build.partitions = huge_app.csv
build_flags =
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
