; BC-250 power controller firmware. See docs/FINAL_FIRMWARE_SPEC.md
; Plain ESP-IDF 6.1.1 (no Arduino core), built through PlatformIO.
; One firmware with both wake methods (Bluetooth and 2.4G dongle mode), the
; method chosen on the wake page (applies after a restart; src/radio.h).
; Settings of our own in sdkconfig.defaults (docs/ESP_IDF_BUILD.md).
; Add -DMEMCHECK through PLATFORMIO_BUILD_FLAGS for heap and 2.4G detector
; lines on the USB console.
[env:xiao_esp32c3]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/61.04.00-RC1/platform-espressif32.zip
platform_packages =
  framework-espidf @ https://github.com/pioarduino/esp-idf/releases/download/v6.1.1/esp-idf-v6.1.1.tar.xz
board = seeed_xiao_esp32c3
framework = espidf
extra_scripts =
  pre:touch_buildinfo.py
  post:tools/ram_guard.py
; same table as Arduino's min_spiffs.csv: devices running 2.1.20 or later
; update over WiFi and keep their table (docs/ESP_IDF_BUILD.md)
board_build.partitions = partitions.csv
; gzip copies made by touch_buildinfo.py from ui/*.html; also listed in
; src/CMakeLists.txt: PlatformIO makes the .S files from this list
board_build.embed_files =
  ui/gz/index.html.gz
  ui/gz/setup.html.gz
; PC scripts served at /bc250-setup.sh and /bc250-update.sh (src/web.cpp)
board_build.embed_txtfiles =
  pc_scripts/bc250-setup.sh
  pc_scripts/bc250-update.sh
lib_deps =
  bblanchon/ArduinoJson@^7.0.0
