<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 830" width="1180" height="830" font-family="Helvetica, Arial, sans-serif">
  <rect width="1180" height="830" fill="#ffffff"/>
  <text x="590" y="36" text-anchor="middle" font-size="24" font-weight="bold" fill="#111">BC-250 Power Controller rev A: wiring</text>
  <text x="590" y="58" text-anchor="middle" font-size="13" fill="#444">Schematic sketch, not to scale. Same connections as the tested perfboard build (docs/HARDWARE.md).</text>

  <!-- ================= board ================= -->
  <rect x="400" y="200" width="380" height="290" rx="22" fill="#e9f3e6" stroke="#2b5d2b" stroke-width="3"/>
  <text x="590" y="232" text-anchor="middle" font-size="16" font-weight="bold" fill="#1d441d">BC-250 Power Controller</text>
  <text x="590" y="250" text-anchor="middle" font-size="12" fill="#1d441d">XIAO ESP32-C3, U1/U2 optocouplers</text>
  <rect x="520" y="290" width="170" height="90" rx="4" fill="#3b64b8" stroke="#1f3a78" stroke-width="2"/>
  <rect x="676" y="315" width="40" height="40" rx="3" fill="#cfd3d8" stroke="#6b7078" stroke-width="2"/>
  <text x="590" y="340" text-anchor="middle" font-size="13" fill="#fff">XIAO ESP32-C3</text>
  <text x="772" y="338" text-anchor="start" font-size="11" fill="#444" transform="rotate(0)"></text>
  <text x="696" y="396" text-anchor="middle" font-size="11" fill="#1d441d">USB-C</text>

  <!-- J1 on the left edge -->
  <text x="412" y="278" font-size="13" font-weight="bold" fill="#111">J1 ATX</text>
  <g font-size="12" fill="#111">
    <circle cx="400" cy="300" r="7" fill="#fff" stroke="#111" stroke-width="2"/><text x="414" y="304">1 PS_ON#</text>
    <circle cx="400" cy="335" r="7" fill="#fff" stroke="#111" stroke-width="2"/><text x="414" y="339">2 GND</text>
    <circle cx="400" cy="370" r="7" fill="#fff" stroke="#111" stroke-width="2"/><text x="414" y="374">3 +5VSB</text>
  </g>

  <!-- J2 on the bottom edge -->
  <g font-size="12" fill="#111" text-anchor="middle">
    <circle cx="440" cy="490" r="7" fill="#fff" stroke="#111" stroke-width="2"/><text x="440" y="470">1 LED+</text>
    <circle cx="530" cy="490" r="7" fill="#fff" stroke="#111" stroke-width="2"/><text x="530" y="470">2 LED-</text>
    <circle cx="620" cy="490" r="7" fill="#fff" stroke="#111" stroke-width="2"/><text x="620" y="470">3 PWR</text>
    <circle cx="710" cy="490" r="7" fill="#fff" stroke="#111" stroke-width="2"/><text x="710" y="470">4 RST</text>
  </g>
  <text x="426" y="452" font-size="13" font-weight="bold" fill="#111">J2 BC-250</text>

  <!-- J3 on the right edge -->
  <text x="690" y="412" font-size="13" font-weight="bold" fill="#111" text-anchor="start"></text>
  <g font-size="12" fill="#111" text-anchor="end">
    <circle cx="780" cy="330" r="7" fill="#fff" stroke="#111" stroke-width="2"/><text x="766" y="334">1 SW</text>
    <circle cx="780" cy="360" r="7" fill="#fff" stroke="#111" stroke-width="2"/><text x="766" y="364">2 COM</text>
    <circle cx="780" cy="390" r="7" fill="#fff" stroke="#111" stroke-width="2"/><text x="766" y="394">3 LED+</text>
  </g>
  <circle cx="780" cy="420" r="7" fill="#fff" stroke="#111" stroke-width="2"/><text x="766" y="424" font-size="12" text-anchor="end" fill="#111">4 LED-</text>
  <text x="766" y="312" font-size="13" font-weight="bold" fill="#111" text-anchor="end">J3 SWITCH</text>

  <!-- ================= ATX side ================= -->
  <rect x="30" y="110" width="300" height="300" rx="10" fill="#f6f6f6" stroke="#555" stroke-width="2"/>
  <text x="180" y="136" text-anchor="middle" font-size="16" font-weight="bold" fill="#111">ATX power supply, 24-pin plug</text>
  <text x="180" y="154" text-anchor="middle" font-size="11" fill="#444">pin numbers as on the plug (13 is opposite 1)</text>
  <!-- 2 x 12 pin map -->
  <g font-size="9" text-anchor="middle" fill="#333">
    <g id="rowB">
      <rect x="46"  y="166" width="20" height="22" fill="#eee" stroke="#999"/><text x="56"  y="181">13</text>
      <rect x="66"  y="166" width="20" height="22" fill="#eee" stroke="#999"/><text x="76"  y="181">14</text>
      <rect x="86"  y="166" width="20" height="22" fill="#222" stroke="#000"/><text x="96"  y="181" fill="#fff">15</text>
      <rect x="106" y="166" width="20" height="22" fill="#2a9d3a" stroke="#14591e"/><text x="116" y="181" fill="#fff" font-weight="bold">16</text>
      <rect x="126" y="166" width="20" height="22" fill="#eee" stroke="#999"/><text x="136" y="181">17</text>
      <rect x="146" y="166" width="20" height="22" fill="#eee" stroke="#999"/><text x="156" y="181">18</text>
      <rect x="166" y="166" width="20" height="22" fill="#eee" stroke="#999"/><text x="176" y="181">19</text>
      <rect x="186" y="166" width="20" height="22" fill="#eee" stroke="#999"/><text x="196" y="181">20</text>
      <rect x="206" y="166" width="20" height="22" fill="#eee" stroke="#999"/><text x="216" y="181">21</text>
      <rect x="226" y="166" width="20" height="22" fill="#eee" stroke="#999"/><text x="236" y="181">22</text>
      <rect x="246" y="166" width="20" height="22" fill="#eee" stroke="#999"/><text x="256" y="181">23</text>
      <rect x="266" y="166" width="20" height="22" fill="#eee" stroke="#999"/><text x="276" y="181">24</text>
    </g>
    <g id="rowA">
      <rect x="46"  y="188" width="20" height="22" fill="#eee" stroke="#999"/><text x="56"  y="203">1</text>
      <rect x="66"  y="188" width="20" height="22" fill="#eee" stroke="#999"/><text x="76"  y="203">2</text>
      <rect x="86"  y="188" width="20" height="22" fill="#eee" stroke="#999"/><text x="96"  y="203">3</text>
      <rect x="106" y="188" width="20" height="22" fill="#eee" stroke="#999"/><text x="116" y="203">4</text>
      <rect x="126" y="188" width="20" height="22" fill="#eee" stroke="#999"/><text x="136" y="203">5</text>
      <rect x="146" y="188" width="20" height="22" fill="#eee" stroke="#999"/><text x="156" y="203">6</text>
      <rect x="166" y="188" width="20" height="22" fill="#eee" stroke="#999"/><text x="176" y="203">7</text>
      <rect x="186" y="188" width="20" height="22" fill="#eee" stroke="#999"/><text x="196" y="203">8</text>
      <rect x="206" y="188" width="20" height="22" fill="#7b3fa0" stroke="#4a1f66"/><text x="216" y="203" fill="#fff" font-weight="bold">9</text>
      <rect x="226" y="188" width="20" height="22" fill="#eee" stroke="#999"/><text x="236" y="203">10</text>
      <rect x="246" y="188" width="20" height="22" fill="#eee" stroke="#999"/><text x="256" y="203">11</text>
      <rect x="266" y="188" width="20" height="22" fill="#eee" stroke="#999"/><text x="276" y="203">12</text>
    </g>
  </g>
  <text x="180" y="232" text-anchor="middle" font-size="11" fill="#444">Only three wires are used. Any black wire is a valid GND;</text>
  <text x="180" y="246" text-anchor="middle" font-size="11" fill="#444">pin 15 sits next to pin 16 and is the easiest to reach.</text>

  <!-- wire list -->
  <g font-size="13" fill="#111">
    <line x1="48" y1="285" x2="104" y2="285" stroke="#2a9d3a" stroke-width="8" stroke-linecap="round"/><text x="116" y="290">pin 16, green: PS_ON#</text>
    <line x1="48" y1="320" x2="104" y2="320" stroke="#222" stroke-width="8" stroke-linecap="round"/><text x="116" y="325">pin 15, black: GND (COM)</text>
    <line x1="48" y1="355" x2="104" y2="355" stroke="#7b3fa0" stroke-width="8" stroke-linecap="round"/><text x="116" y="360">pin 9, purple: +5VSB</text>
  </g>
  <text x="180" y="392" text-anchor="middle" font-size="11" fill="#444">Do not connect pin 14 (-12 V) or any other wire.</text>

  <!-- ATX wires to J1 -->
  <path d="M 300 285 H 345 V 300 H 393" fill="none" stroke="#2a9d3a" stroke-width="5" stroke-linejoin="round"/>
  <path d="M 300 320 H 355 V 335 H 393" fill="none" stroke="#222" stroke-width="5" stroke-linejoin="round"/>
  <path d="M 300 355 H 365 V 370 H 393" fill="none" stroke="#7b3fa0" stroke-width="5" stroke-linejoin="round"/>
  <line x1="106" y1="285" x2="300" y2="285" stroke="#2a9d3a" stroke-width="0"/>

  <!-- ================= BC-250 side ================= -->
  <rect x="380" y="610" width="400" height="200" rx="10" fill="#f6f6f6" stroke="#555" stroke-width="2"/>
  
  <g font-size="12" fill="#111" text-anchor="middle">
    <circle cx="440" cy="676" r="9" fill="#d9a441" stroke="#7a5a12" stroke-width="2"/><text x="440" y="708">power LED +</text><text x="440" y="722">(anode)</text>
    <circle cx="530" cy="676" r="9" fill="#d9a441" stroke="#7a5a12" stroke-width="2"/><text x="530" y="708">power LED -</text><text x="530" y="722">(cathode)</text>
    <circle cx="620" cy="676" r="9" fill="#d9a441" stroke="#7a5a12" stroke-width="2"/><text x="620" y="708">power button</text><text x="620" y="722">live pad</text>
    <circle cx="710" cy="676" r="9" fill="#d9a441" stroke="#7a5a12" stroke-width="2"/><text x="710" y="708">reset button</text><text x="710" y="722">live pad</text>
  </g>
  <text x="580" y="758" text-anchor="middle" font-size="16" font-weight="bold" fill="#111">BC-250 board, front-panel pads</text>
  <text x="580" y="780" text-anchor="middle" font-size="11" fill="#444">Buttons: wire only the live (about 3.3 V) pad.</text><text x="580" y="796" text-anchor="middle" font-size="11" fill="#444">The ground reaches the controller through the ATX supply.</text>
  <g stroke-width="4" fill="none" stroke-linecap="round">
    <line x1="440" y1="497" x2="440" y2="667" stroke="#d62828"/>
    <line x1="530" y1="497" x2="530" y2="667" stroke="#555"/>
    <line x1="620" y1="497" x2="620" y2="667" stroke="#2c7be5"/>
    <line x1="710" y1="497" x2="710" y2="667" stroke="#e87722"/>
  </g>
    
  <!-- ================= front switch ================= -->
  <rect x="900" y="330" width="250" height="240" rx="12" fill="#f6f6f6" stroke="#555" stroke-width="2"/>
  <text x="1025" y="356" text-anchor="middle" font-size="16" font-weight="bold" fill="#111">Front illuminated switch</text>
  <text x="1025" y="374" text-anchor="middle" font-size="11" fill="#444">5-wire pigtail</text>
  <g font-size="13" fill="#111">
    <line x1="912" y1="400" x2="960" y2="400" stroke="#bbb" stroke-width="9" stroke-linecap="round"/><line x1="912" y1="400" x2="960" y2="400" stroke="#fff" stroke-width="6" stroke-linecap="round"/><text x="972" y="405">white: contact NO</text>
    <line x1="912" y1="430" x2="960" y2="430" stroke="#f2c200" stroke-width="8" stroke-linecap="round"/><text x="972" y="435">yellow: common</text>
    <line x1="912" y1="460" x2="960" y2="460" stroke="#d62828" stroke-width="8" stroke-linecap="round"/><text x="972" y="465">red: LED +</text>
    <line x1="912" y1="490" x2="960" y2="490" stroke="#222" stroke-width="8" stroke-linecap="round"/><text x="972" y="495">black: LED -</text>
    <line x1="912" y1="525" x2="935" y2="525" stroke="#2a9d3a" stroke-width="8" stroke-linecap="round"/><text x="972" y="530" fill="#666">green: NC, not used</text>
    <text x="943" y="530" font-size="16" fill="#d62828" font-weight="bold">x</text>
  </g>
  <text x="1025" y="556" text-anchor="middle" font-size="11" fill="#444">cut the green wire short and insulate it</text>
  <path d="M 900 400 H 850 V 330 H 787" fill="none" stroke="#bbb" stroke-width="7" stroke-linejoin="round"/>
  <path d="M 900 400 H 850 V 330 H 787" fill="none" stroke="#fff" stroke-width="4" stroke-linejoin="round"/>
  <path d="M 900 430 H 835 V 360 H 787" fill="none" stroke="#f2c200" stroke-width="5" stroke-linejoin="round"/>
  <path d="M 900 460 H 820 V 390 H 787" fill="none" stroke="#d62828" stroke-width="5" stroke-linejoin="round"/>
  <path d="M 900 490 H 805 V 420 H 787" fill="none" stroke="#222" stroke-width="5" stroke-linejoin="round"/>

  <!-- ================= power warning ================= -->
  <rect x="30" y="480" width="320" height="170" rx="10" fill="#fff4f4" stroke="#c0392b" stroke-width="2"/>
  <text x="190" y="506" text-anchor="middle" font-size="15" font-weight="bold" fill="#a02318">Power: read before connecting</text>
  <g font-size="12" fill="#222">
    <text x="44" y="532">1. The XIAO 5V pin is USB VBUS.</text>
    <text x="44" y="552">2. Never connect USB and the ATX +5VSB wire</text>
    <text x="44" y="568">    together, unless diode D1 is fitted and the</text>
    <text x="44" y="584">    JP2 bypass is cut (about 0.3 V drop).</text>
    <text x="44" y="608">3. First power-up: USB only, nothing else wired.</text>
    <text x="44" y="628">4. The supply must have +5VSB (ATX style).</text>
  </g>
</svg>
